<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#000}
.p{position:relative;width:1080px;height:1080px;overflow:hidden;display:grid;place-items:center;margin-bottom:20px}
.a{background:radial-gradient(circle at 50% 38%,#26282c 0%,#0b0c0e 55%,#000 100%)}
.b{width:760px;height:760px;border-radius:50%;display:grid;place-items:center;font-family:'JetBrains Mono';font-weight:800;font-size:300px;letter-spacing:-10px;padding-right:10px;
  color:#060607;background:radial-gradient(circle at 35% 26%,#fff 0 16%,#eceef1 40%,#b9bdc3 78%,#8d9198 100%);
  box-shadow:inset 0 -40px 80px rgba(0,0,0,.28),inset 0 24px 30px #fff,0 60px 120px rgba(0,0,0,.8),0 0 0 2px rgba(255,255,255,.25)}
.d{background:#f3f4f6}
.d .b{color:#f5f6f7;background:radial-gradient(circle at 35% 26%,#5a5e64 0 10%,#202226 45%,#050506 100%);box-shadow:inset 0 -30px 70px rgba(255,255,255,.08),inset 0 20px 26px rgba(255,255,255,.35),0 60px 120px rgba(0,0,0,.45)}
</style></head><body>
<div class="p a" id="p1"><div class="b">&gt;_</div></div>
<div class="p d" id="p2"><div class="b">&gt;_</div></div>
</body></html>
